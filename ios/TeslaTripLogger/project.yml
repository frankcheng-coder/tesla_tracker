name: TeslaTripLogger
options:
  bundleIdPrefix: com.example.teslatriplogger
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  TeslaTripLogger:
    type: application
    platform: iOS
    sources:
      - path: TeslaTripLogger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.teslatriplogger
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tesla Trips
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: TeslaTripLogger/Info.plist
      properties:
        NSLocationWhenInUseUsageDescription: >-
          Tesla Trips shows your vehicle's trip routes and parking locations on
          a map. This app is read-only and never controls your vehicle.
        UIApplicationSupportsIndirectInputEvents: true
